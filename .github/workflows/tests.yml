# Draait bij elke push en pull request de volledige testsuite en de
# productie-build, zodat een fout niet pas bij de klant opvalt.
name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # gd + exif: foto's verkleinen/rechtdraaien; sqlite: testdatabase.
          extensions: gd, exif, pdo_sqlite, sqlite3, mbstring
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Composer-pakketten
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Front-end build (productie)
        run: |
          npm ci
          npm run build

      - name: Omgeving
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Tests
        run: php artisan test

      # Kant-en-klaar pakket voor webhosting zonder Node/Composer: uitpakken op de
      # server, eigen .env erbij, migreren. Te downloaden onder Actions → deze run → Artifacts.
      - name: Releasepakket
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist --no-progress
          php artisan view:clear
          rm -f .env
          zip -rq release.zip . -x '.git/*' 'node_modules/*' 'tests/*' '.github/*' '*.log'

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: release
          path: release.zip
          retention-days: 30
